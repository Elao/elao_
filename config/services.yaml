# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Model/'
            - '../src/Kernel.php'
            - '../src/Bridge/Glide/Bundle/'
            - '../src/Stenope/Processor/ResizeImagesContentProcessor.php'
            - '../src/Stenope/Provider/SampleRemovalProvider.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Stenope\Processor\DefaultTocProcessor:
        tags:
            - name: 'stenope.processor'
              priority: '-90' # before the TableOfContentProcessor

    App\Stenope\Processor\ElaomojisProcessor:
        tags:
            - name: 'stenope.processor'
              priority: '10' # MUST be before any processor using the SharedHtmlCrawlerManager

    # Use our own processor to add anchors to headings (by wrapping these headings content in <a> tags)
    App\Stenope\Processor\HtmlAnchorProcessor:
        tags: [{ name: stenope.processor, priority: -20 }]

    # Turns the `[^n]` markers into links towards the footnotes rendered by the article template.
    App\Stenope\Processor\HtmlFootnotesProcessor:
        tags: [{ name: stenope.processor, priority: -10 }]

    # Wraps content tables in a scrollable container, named after the heading above them.
    App\Stenope\Processor\HtmlTablesProcessor:
        tags: [{ name: stenope.processor, priority: -15 }]

    # Découpe un article au format entretien en zone commune + un corps par mode de lecture.
    # Après le DefaultTocProcessor (-90), dont il reprend la profondeur de sommaire,
    # et avant les TableOfContentProcessor par mode (-100).
    App\Stenope\Processor\ArticleReadingModesProcessor:
        tags: [{ name: stenope.processor, priority: -95 }]

    # Re-découpe les citations du mode entretien en remises en contexte et prises de parole.
    # Après la découpe des modes (-95), et sur la seule propriété du mode entretien : ces
    # blocs sont ainsi mécaniquement indisponibles ailleurs.
    App\Stenope\Processor\HtmlInterviewBlocksProcessor:
        tags: [{ name: stenope.processor, priority: -96 }]

    App\Stenope\Processor\GithubEditLinkProcessor:
        $repository: '%env(APP_GITHUB_REPO)%'
        $reference: '%env(APP_GITHUB_REF)%'

    # Un sommaire par mode de lecture, sur le modèle des trois `ResizeImagesContentProcessor`
    # ci-dessous : même classe, plusieurs instances, chacune sur sa propriété.
    # Le sommaire principal, lui, a été neutralisé par l'ArticleReadingModesProcessor —
    # il ne porterait plus que les titres de la zone commune.
    # `parent` plutôt qu'une définition repartant de zéro : les profondeurs min et max
    # sont posées sur la définition du bundle par `StenopeExtension`, depuis
    # `stenope.processors.toc`. Les redéclarer ici les figerait aux valeurs par défaut
    # du constructeur, et une configuration de projet ne s'appliquerait qu'au sommaire
    # des articles ordinaires. Les tags, eux, ne s'héritent pas : d'où leur reprise.
    table_of_content_processor.article.narrative:
        parent: Stenope\Bundle\Processor\TableOfContentProcessor
        arguments:
            $contentProperty: narrativeContent
            $tableOfContentProperty: narrativeTableOfContent
        tags: [{ name: stenope.processor, priority: -100 }]

    table_of_content_processor.article.interview:
        parent: Stenope\Bundle\Processor\TableOfContentProcessor
        arguments:
            $contentProperty: interviewContent
            $tableOfContentProperty: interviewTableOfContent
        tags: [{ name: stenope.processor, priority: -100 }]

    resize_images_content_processor.case_study:
        class: App\Stenope\Processor\ResizeImagesContentProcessor
        arguments:
            $type: App\Model\CaseStudy
            $preset: case_study_content

    resize_images_content_processor.article:
        class: App\Stenope\Processor\ResizeImagesContentProcessor
        arguments:
            $type: App\Model\Article
            $preset: article_content

    resize_images_content_processor.glossary.term:
        class: App\Stenope\Processor\ResizeImagesContentProcessor
        arguments:
            $type: App\Model\Glossary\Term
            $preset: glossary_content

    App\Stenope\Provider\SampleRemovalProvider.Article:
        class: App\Stenope\Provider\SampleRemovalProvider
        decorates: stenope.provider.files.App\Model\Article
        arguments:
            $provider: '@.inner'
            $disabled: '%env(bool:INCLUDE_SAMPLES)%'
            $ignored: ['styleguide/example', 'styleguide/entretien-deux-modes', 'elao/trame-itw']

    App\Stenope\Manager\FilteringArticlesContentManager:
        decorates: Stenope\Bundle\ContentManagerInterface
        arguments:
            $contentManager: '@.inner'
            $filterUnpublished: '%env(not:bool:SHOW_UNPUBLISHED_ARTICLES)%'

    App\Stenope\Provider\SampleRemovalProvider.CaseStudy:
        class: App\Stenope\Provider\SampleRemovalProvider
        decorates: stenope.provider.files.App\Model\CaseStudy
        arguments:
            $provider: '@.inner'
            $disabled: '%env(bool:INCLUDE_SAMPLES)%'
            $ignored: ['example']

    App\Stenope\Provider\SampleRemovalProvider.Job:
        class: App\Stenope\Provider\SampleRemovalProvider
        decorates: stenope.provider.files.App\Model\Job
        arguments:
            $provider: '@.inner'
            $disabled: '%env(bool:INCLUDE_SAMPLES)%'
            $ignored: ['example']

    App\Command\GenerateArticleCommand:
        arguments:
            $path: '%kernel.project_dir%/content/blog'
